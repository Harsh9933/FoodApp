spring:
  application:
    name: foodai-backend

server:
  port: 8080

# Local model configuration (Ollama)
local-model:
  base-url: http://localhost:11434
  model: tinyllama
  timeout-seconds: 60

# Gemini (disabled for now)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash

logging:
  level:
    com.foodai: DEBUG
    org.springframework.web: INFO